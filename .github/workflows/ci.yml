name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      # dogfood: our own comments must pass our own linter (corpus files are
      # deliberate noise and stay out of the scan)
      - name: Self-lint
        shell: bash
        run: uv run unwaffle check src/ tests/test_*.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # the same tests/corpus tree drives both implementations
      - name: Run tests
        run: cargo test
        working-directory: rust
